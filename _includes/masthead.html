<div class="masthead">
  <nav id="site-nav" class="site-nav">
    <a class="site-nav__name" href="{{ site.racine }}">{{ site.name }}</a>

    <ul class="site-nav__links">
      {%- for link in site.data.navigation.main -%}
        <li>
          <a href="{{ link.url | relative_url }}"
             class="{% if link.id and page.nav == link.id %}is-current {% endif %}{% if link.lang %}site-nav__lang {% endif %}{% if link.url contains '://' %}is-external{% endif %}"
             {%- if link.url contains '://' %} rel="noopener"{% endif %}>{{ link.title }}</a>
        </li>
      {%- endfor -%}
      <li>
        <button class="theme-toggle" type="button" id="theme-toggle"
                title="{{ site.theme_toggle_label }}"
                aria-label="{{ site.theme_toggle_label }}">
          <svg class="theme-toggle__sun" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4.2"/>
            <path d="M12 2.6v2.2M12 19.2v2.2M4.2 4.2l1.6 1.6M18.2 18.2l1.6 1.6M2.6 12h2.2M19.2 12h2.2M4.2 19.8l1.6-1.6M18.2 5.8l1.6-1.6"/>
          </svg>
          <svg class="theme-toggle__moon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.7" stroke-linejoin="round" aria-hidden="true">
            <path d="M20.5 14.4A8.6 8.6 0 0 1 9.6 3.5a8.6 8.6 0 1 0 10.9 10.9z"/>
          </svg>
        </button>
      </li>
    </ul>
  </nav>
</div>
